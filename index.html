<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Probador Automotor BLE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090d12">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">
    <section class="topbar">
      <div class="brand">
        <strong>Probador Automotor BLE</strong>
        <span id="subTitle">Entrada amarilla · rango automático</span>
      </div>
      <button id="connectBtn" class="statusBtn" type="button">
        <span id="statusDot" class="dot off"></span>
        <span id="connText">Conectar</span>
      </button>
    </section>

    <section class="scope-card">
      <div class="scope-header">
        <div>
          <div class="mode-title" id="modeTitle">Voltímetro</div>
          <div class="status-line" id="status">Sin conectar</div>
        </div>
        <div class="range-pill" id="rangePill">Rango --</div>
      </div>

      <div class="canvas-wrap">
        <canvas id="chart"></canvas>
        <div class="axis-badge v" id="vScale">Auto V/div</div>
        <div class="axis-badge t" id="tScale">Tiempo</div>
      </div>

      <div class="readout">
        <div class="main-value">
          <div class="label" id="mainLabel">Tensión actual</div>
          <div><span class="value" id="voltage">--.--</span><span class="unit" id="mainUnit">V</span></div>
          <div class="sub" id="mainSub">Esperando lectura</div>
        </div>
        <div class="metric-grid">
          <div class="metric"><div class="k" id="m1k">Mín</div><div class="v" id="m1v">--</div></div>
          <div class="metric"><div class="k" id="m2k">Máx</div><div class="v" id="m2v">--</div></div>
          <div class="metric"><div class="k" id="m3k">Pico</div><div class="v" id="m3v">--</div></div>
          <div class="metric"><div class="k" id="m4k">Rango</div><div class="v" id="m4v">--</div></div>
        </div>
      </div>
    </section>

    <section class="actions" id="actions">
      <button id="autoBtn" class="act primary" type="button">AUTO</button>
      <button id="freezeBtn" class="act" type="button">CONGELAR</button>
      <button id="voiceBtn" class="act" type="button">VOZ OFF</button>
      <button id="wakeBtn" class="act" type="button">PANTALLA OFF</button>
    </section>

    <section class="mode-card">
      <div class="modes" id="modes"></div>
    </section>

    <div class="footer-strip">
      <span>BLE <b id="bleState">inactivo</b></span>
      <span><b id="samples">0</b> muestras</span>
    </div>

    <div class="hidden-telemetry" aria-hidden="true">
      <span id="lastRaw">---</span>
      <span id="range">RANGO --</span>
      <span id="connState">---</span>
      <span id="badge">OFF</span>
    </div>
  </main>

  <script src="./app.js"></script>
</body>
</html>
