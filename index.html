<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Probador Automotor BLE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090d12">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">
    <section class="topbar">
      <div class="brand">
        <strong>Probador Automotor BLE</strong>
        <span id="subTitle">Entrada amarilla · rango automático</span>
      </div>
      <button id="connectBtn" class="statusBtn" type="button">
        <span id="statusDot" class="dot off"></span>
        <span id="connText">Conectar</span>
      </button>
    </section>

    <section class="scope-card">
      <div class="scope-header">
        <div>
          <div class="mode-title" id="modeTitle">Voltímetro</div>
          <div class="status-line" id="status">Sin conectar</div>
        </div>
        <div class="range-pill" id="rangePill">Rango --</div>
      </div>

      <div class="canvas-wrap" id="chartOpenArea" role="button" tabindex="0" aria-label="Abrir gráfico ampliado">
        <canvas id="chart"></canvas>
        <div class="axis-badge v" id="vScale">Auto V/div</div>
        <div class="axis-badge t" id="tScale">Tiempo</div>
        <div class="tap-hint">Tocar para ampliar</div>
      </div>

      <div class="readout">
        <div class="main-value">
          <div class="label" id="mainLabel">Tensión actual</div>
          <div><span class="value" id="voltage">--.--</span><span class="unit" id="mainUnit">V</span></div>
          <div class="sub" id="mainSub">Esperando lectura</div>
        </div>
        <div class="metric-grid">
          <div class="metric"><div class="k" id="m1k">Mín</div><div class="v" id="m1v">--</div></div>
          <div class="metric"><div class="k" id="m2k">Máx</div><div class="v" id="m2v">--</div></div>
          <div class="metric"><div class="k" id="m3k">Pico</div><div class="v" id="m3v">--</div></div>
          <div class="metric"><div class="k" id="m4k">Rango</div><div class="v" id="m4v">--</div></div>
        </div>
      </div>
    </section>

    <section class="actions" id="actions">
      <button id="autoBtn" class="act primary" type="button">AUTO</button>
      <button id="freezeBtn" class="act" type="button">CONGELAR</button>
      <button id="voiceBtn" class="act" type="button">VOZ OFF</button>
      <button id="wakeBtn" class="act" type="button">PANTALLA OFF</button>
    </section>

    <section class="mode-card">
      <div class="modes" id="modes"></div>
    </section>

    <div class="hidden-telemetry" aria-hidden="true">
      <span id="bleState">inactivo</span>
      <span id="samples">0</span>
      <span id="lastRaw">---</span>
      <span id="range">RANGO --</span>
      <span id="connState">---</span>
      <span id="badge">OFF</span>
    </div>
  </main>

  <section id="chartOverlay" class="chart-overlay" aria-hidden="true">
    <div class="chart-full-panel" role="dialog" aria-modal="true" aria-label="Gráfico ampliado">
      <div class="chart-full-header">
        <div>
          <div class="chart-full-title" id="fullTitle">Voltímetro</div>
          <div class="chart-full-sub" id="fullSub">Entrada amarilla</div>
        </div>
        <button id="fullClose" class="icon-close" type="button" aria-label="Cerrar gráfico">×</button>
      </div>

      <div class="chart-full-wrap">
        <canvas id="chartFull"></canvas>
      </div>

      <div class="chart-full-metrics">
        <div class="full-metric min"><span>Min</span><b id="fullMin">--</b></div>
        <div class="full-metric max"><span>Max</span><b id="fullMax">--</b></div>
        <div class="full-metric pico"><span>Pico</span><b id="fullPico">--</b></div>
        <div class="full-metric"><span id="fullExtraLabel">Rango</span><b id="fullExtra">--</b></div>
      </div>

      <div class="chart-full-actions">
        <button id="fullFreeze" class="act" type="button">CONGELAR</button>
        <button id="fullClear" class="act" type="button">LIMPIAR</button>
        <button id="fullClose2" class="act primary" type="button">CERRAR</button>
      </div>
    </div>
  </section>

  <script src="./app.js"></script>
</body>
</html>
